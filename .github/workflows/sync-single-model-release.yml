name: Sync single-model release

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Publish a new patched revision for the current upstream release
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-single-model-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: shared-model-release

      - name: Resolve upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          upstream_tag="$(gh api repos/anomalyco/opencode/releases/latest --jq .tag_name)"
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "version=${upstream_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Apply patch to upstream release
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.upstream_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch --tags origin
          git fetch --no-tags upstream "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"
          git fetch origin shared-model-selection

          # Start from a clean upstream tag, remove workflows from the release branch, then apply our customization.
          git checkout "$UPSTREAM_TAG"
          shopt -s nullglob
          workflow_files=(.github/workflows/*.yml .github/workflows/*.yaml)
          if (( ${#workflow_files[@]} )); then
            git rm -f "${workflow_files[@]}"
            git commit -m "Remove upstream workflows from patched release"
          fi
          git cherry-pick --no-edit origin/shared-model-selection

      - name: Resolve patched release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.upstream_tag }}
          FORCE: ${{ inputs.force || false }}
        run: |
          # Find the latest existing tag for this upstream release
          latest_tag="$(git tag --list "${UPSTREAM_TAG}-single-model.*" --sort=-version:refname | sed -n '1p')"
          if [[ -n "$latest_tag" && "$FORCE" != "true" ]]; then
            echo "release_tag=$latest_tag" >> "$GITHUB_OUTPUT"
            if gh release view "$latest_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          revision=0
          while IFS= read -r tag; do
            suffix="${tag##*.}"
            if [[ "$suffix" =~ ^[0-9]+$ ]] && (( suffix > revision )); then
              revision="$suffix"
            fi
          done < <(git tag --list "${UPSTREAM_TAG}-single-model.*")

          release_tag="${UPSTREAM_TAG}-single-model.$((revision + 1))"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-bun
        if: steps.release.outputs.exists != 'true'

      - name: Verify patch
        if: steps.release.outputs.exists != 'true'
        run: |
          bun run --cwd packages/tui test test/context/local.test.ts
          bun run --cwd packages/tui typecheck

      - name: Build Linux binaries
        if: steps.release.outputs.exists != 'true'
        env:
          OPENCODE_VERSION: ${{ steps.upstream.outputs.version }}
        run: bun run packages/opencode/script/build.ts

      - name: Package release
        if: steps.release.outputs.exists != 'true'
        run: |
          mkdir release
          tar -C packages/opencode/dist/opencode-linux-x64-baseline/bin -czf release/opencode-linux-x64-baseline.tar.gz opencode
          tar -C packages/opencode/dist/opencode-linux-arm64/bin -czf release/opencode-linux-arm64.tar.gz opencode
          cd release
          sha256sum *.tar.gz > checksums.txt

      - name: Publish release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.upstream_tag }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "RELEASE_TOKEN secret is not set" >&2
            exit 1
          fi

          git tag "$RELEASE_TAG"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:shared-model-release "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target shared-model-release \
            --title "OpenCode $RELEASE_TAG" \
            --notes "Patched build of anomalyco/opencode $UPSTREAM_TAG with opt-in shared Plan and Build model selection."
